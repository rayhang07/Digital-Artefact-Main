name: CI

on:
  push:
    branches: [ appmod/java-upgrade-20261028133824 ]
  pull_request:
    branches: [ main ]

permissions:
    contents: read
    
jobs:
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                distribution: 'temurin'
                java-version: '17'
            
            - name: Compile with Maven Wrapper
              run: ./mvnw clean compile
            
            - name: Run tests
              run: ./mvnw test

            - name: Build with Maven Wrapper
              run: ./mvnw package

            - name: Verify with Maven Wrapper
              run: ./mvnw verify
